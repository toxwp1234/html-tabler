.hta:hover{transform:scale(2.2) rotate(8deg);box-shadow:0 0 14px rgba(0,0,0,.5)}
.htb:hover{transform:scale(1.5) rotate(180deg)}
.htc:hover{transform:perspective(200px) rotateY(180deg) scale(1.3)}
.htd:hover{transform:perspective(200px) rotateX(180deg) scale(1.3)}
.hte:hover{transform:skew(-18deg,6deg) scale(1.6)}
.htf:hover{transform:scale(1.7);filter:invert(1)}
.htg:hover{transform:scale(1.7) rotate(3deg);filter:brightness(1.7) saturate(2);box-shadow:0 0 18px 4px var(--x)}
.hth:hover{transform:translateY(-10px) scale(1.7);box-shadow:0 12px 14px rgba(0,0,0,.5)}
.hti:hover{transform:translate(3px,-3px) scale(1.6);filter:hue-rotate(120deg)}
.htj:hover{transform:scale(2.4) rotate(-12deg);filter:contrast(1.5)}
.htk:hover{transform:scale(1.6);background:var(--x)}

.htm:hover{transform:scaleX(2.6)}
.htn:hover{transform:scaleY(2.6)}
.hto:hover{transform:skewX(30deg) scale(1.5)}

.atd:active{transform:scaleX(2.2) scaleY(.4)}

.atf:active{transform:rotate(-360deg) scale(.3)}
.atg:active{transform:scale(4)}
.ath:active{transform:skew(40deg,0) scale(1.8)}
.ati:active{transform:translateY(22px) scale(.5)}

.hfb:hover{filter:hue-rotate(180deg) saturate(2)}
.hfc:hover{filter:brightness(2.2)}
.hfd:hover{filter:saturate(3.5)}
.hfe:hover{filter:contrast(2.2)}
.hff:hover{filter:sepia(1) brightness(1.3)}
.hfg:hover{filter:grayscale(1)}

.afa:active{filter:brightness(3.5)}
.afb:active{filter:invert(1) hue-rotate(120deg)}
.afc:active{filter:contrast(3) saturate(3)}
.afd:active{filter:opacity(.1)}
.afe:active{filter:sepia(1) brightness(1.6) saturate(2)}
.aff:active{filter:drop-shadow(0 0 12px var(--x)) brightness(2)}
.ifa{animation:hue 6s ease-in-out infinite}
@keyframes hue{from{filter:hue-rotate(0)}to{filter:hue-rotate(360deg)}}
.ifb{animation:brea 3s ease-in-out infinite}
@keyframes brea{0%,100%{filter:brightness(.6)}50%{filter:brightness(1.6)}}
.ifc{animation:blnk 4s ease-in-out infinite}
@keyframes blnk{0%,100%{opacity:1}45%{opacity:1}50%{opacity:.1}55%{opacity:1}}
.ifd{animation:satp 5s ease-in-out infinite}
@keyframes satp{0%,100%{filter:saturate(.4)}50%{filter:saturate(2.2)}}
.ife{animation:conp 4s ease-in-out infinite}
@keyframes conp{0%,100%{filter:contrast(.7)}50%{filter:contrast(1.9)}}
.iff{animation:glow 3s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 0 var(--x))}50%{filter:drop-shadow(0 0 8px var(--x))}}
.ima{animation:spin 4s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.imb{animation:spnr 5s linear infinite}
@keyframes spnr{from{transform:rotate(0)}to{transform:rotate(-360deg)}}
.imc{animation:flt 2s ease-in-out infinite}
@keyframes flt{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.imd{animation:wob 1s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
.ime{animation:puls 2s ease-in-out infinite}
@keyframes puls{0%,100%{transform:scale(.85)}50%{transform:scale(1.2)}}
.imf{animation:orb 3s linear infinite}
@keyframes orb{from{transform:rotate(0) translateX(3px) rotate(0)}to{transform:rotate(360deg) translateX(3px) rotate(-360deg)}}

.db{animation-delay:-0.37s}
.dc{animation-delay:-0.74s}
.dd{animation-delay:-1.11s}
.de{animation-delay:-1.48s}
.df{animation-delay:-1.85s}
.dg{animation-delay:-2.22s}
.dh{animation-delay:-2.59s}
.di{animation-delay:-2.96s}
.dj{animation-delay:-3.33s}
.dk{animation-delay:-3.7s}
.dl{animation-delay:-4.07s}
.dm{animation-delay:-4.44s}
.dn{animation-delay:-4.81s}
.do{animation-delay:-5.18s}
.dp{animation-delay:-5.55s}
td:hover + td{transform:translateX(15px) scale(1.6);z-index:15}
td:hover + td + td{transform:translateX(9px) scale(1.3);z-index:14}
td:hover + td + td + td{transform:translateX(4px) scale(1.12)}
td:has(+ td:hover){transform:translateX(-15px) scale(1.6);z-index:15}
td:has(+ td + td:hover){transform:translateX(-9px) scale(1.3);z-index:14}
td:has(+ td + td + td:hover){transform:translateX(-4px) scale(1.12)}
tr:has(+ tr:has(td:hover)) td{filter:brightness(1.5)}
tr:has(td:hover) + tr td{filter:brightness(1.5)}
td:active + td{transform:translate(26px,-15px) rotate(32deg);z-index:26}
td:active + td + td{transform:translate(40px,-6px) rotate(20deg);z-index:25}
td:has(+ td:active){transform:translate(-26px,-15px) rotate(-32deg);z-index:26}
td:has(+ td + td:active){transform:translate(-40px,-6px) rotate(-20deg);z-index:25}
tr:has(td:active) + tr td{transform:translateY(22px) scale(.8);filter:brightness(1.7)}
tr:has(+ tr:has(td:active)) td{transform:translateY(-22px) scale(.8);filter:brightness(1.7)}
